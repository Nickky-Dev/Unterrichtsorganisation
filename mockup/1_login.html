
<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: "class"
        };

      
        if (localStorage.getItem("darkMode") === "true") {
            document.documentElement.classList.add("dark");
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("darkMode", String(isDark));
            updateDarkModeIcon();
        }

        function updateDarkModeIcon() {
            const isDark = document.documentElement.classList.contains("dark");
            const icon = document.getElementById("darkModeIcon");
            const button = document.getElementById("darkModeButton");

            if (icon) {
                icon.textContent = isDark ? "☀️" : "🌙";
            }

            if (button) {
                button.title = isDark ? "Hellmodus aktivieren" : "Dark Mode aktivieren";
                button.setAttribute("aria-pressed", String(isDark));
            }
        }

        document.addEventListener("DOMContentLoaded", updateDarkModeIcon);

        function deleteRow(btn) {
            if (confirm("Eintrag wirklich löschen?")) {
                btn.closest("tr").remove();
            }
        }

        function filterTable(inputId, tableId) {
            const query = document.getElementById(inputId).value.toLowerCase();

            document.querySelectorAll(`#${tableId} tbody tr`).forEach((row) => {
                row.style.display = row.innerText.toLowerCase().includes(query)
                    ? ""
                    : "none";
            });
        }

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? "flex" : "none";
        }

        function login() {
            const user = document.getElementById("username").value.toLowerCase();

            if (user.includes("admin")) {
                location.href = "2_admin_home.html";
            } else if (user.includes("leiter") || user.includes("chef")) {
                location.href = "7_schulleiter_home.html";
            } else if (user.includes("sekre")) {
                location.href = "9_sekretariat.html";
            } else {
                location.href = "3_lehrer_home.html";
            }
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-950
             flex items-center justify-center
             min-h-screen font-sans
             text-gray-800 dark:text-gray-100
             transition-colors duration-300">

   
    <div class="bg-white dark:bg-gray-900
                p-8 rounded-xl shadow-lg
                w-96 max-w-[90%]
                border border-gray-200 dark:border-gray-700
                transition-colors duration-300">

     
        <h2 class="text-2xl font-bold mb-6 text-center
                   text-gray-800 dark:text-white">
            Login
        </h2>

        <div class="space-y-4">

           
            <div>
                <label for="username"
                       class="block text-sm font-medium
                              text-gray-700 dark:text-gray-300 mb-1">
                    Benutzername
                </label>

                <input
                    type="text"
                    id="username"
                    autocomplete="username"
                    class="w-full border border-gray-300
                           dark:border-gray-600
                           bg-white dark:bg-gray-800
                           text-gray-800 dark:text-white
                           placeholder-gray-400
                           rounded px-3 py-2
                           focus:ring-2 focus:ring-blue-500
                           focus:outline-none
                           transition-colors duration-300"
                    placeholder="z.B. admin, lehrer..."
                />
            </div>

          
            <div>
                <label for="password"
                       class="block text-sm font-medium
                              text-gray-700 dark:text-gray-300 mb-1">
                    Passwort
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    class="w-full border border-gray-300
                           dark:border-gray-600
                           bg-white dark:bg-gray-800
                           text-gray-800 dark:text-white
                           placeholder-gray-400
                           rounded px-3 py-2
                           focus:ring-2 focus:ring-blue-500
                           focus:outline-none
                           transition-colors duration-300"
                    placeholder="••••••••"
                />
            </div>

          
            <button
                type="button"
                onclick="login()"
                class="w-full bg-blue-600
                       text-white font-semibold
                       py-2 rounded shadow
                       hover:bg-blue-700
                       dark:bg-blue-600
                       dark:hover:bg-blue-500
                       transition-all duration-300 mt-2">
                Anmelden
            </button>

        </div>

       
        <p class="mt-4 text-xs
                  text-gray-500 dark:text-gray-400
                  text-center">
            Tipp: Tippen Sie 'admin', 'leiter', 'sekre'
            oder irgendwas für Lehrer.
        </p>

    </div>

   
    <button
        id="darkModeButton"
        type="button"
        onclick="toggleDarkMode()"
        class="fixed bottom-6 right-6
               bg-white dark:bg-gray-800
               text-gray-800 dark:text-white
               border border-gray-200 dark:border-gray-700
               shadow-lg rounded-full
               w-14 h-14
               flex items-center justify-center
               hover:scale-110 hover:shadow-xl
               active:scale-95
               transition-all duration-300
               focus:outline-none focus:ring-2 focus:ring-blue-500"
        title="Dark Mode aktivieren"
        aria-label="Dark Mode umschalten"
        aria-pressed="false">

        <span id="darkModeIcon" class="text-2xl">🌙</span>

    </button>

</body>
</html>
