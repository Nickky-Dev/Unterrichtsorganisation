<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Herr Mustermann - Antragsportal</title>
		<script src="https://cdn.tailwindcss.com"></script>

		<script>
			function deleteRow(btn) {
				if (confirm("Eintrag wirklich löschen?")) btn.closest("tr").remove();
			}
			function filterTable(inputId, tableId) {
				const query = document.getElementById(inputId).value.toLowerCase();
				document.querySelectorAll(`#${tableId} tbody tr`).forEach((row) => {
					row.style.display = row.innerText.toLowerCase().includes(query)
						? ""
						: "none";
				});
			}
			function toggleModal(id, show) {
				document.getElementById(id).style.display = show ? "flex" : "none";
			}
			function login() {
				const user = document.getElementById("username").value.toLowerCase();
				if (user.includes("admin")) location.href = "2_admin_home.html";
				else if (user.includes("leiter") || user.includes("chef"))
					location.href = "7_schulleiter_home.html";
				else if (user.includes("sekre")) location.href = "9_sekretariat.html";
				else location.href = "3_lehrer_home.html";
			}
		</script>
	</head>
	<body class="bg-gray-100 flex h-screen font-sans text-gray-800">
		<div class="w-64 bg-white border-r flex flex-col h-full shadow-sm">
			<div class="p-5 bg-gray-50 border-b">
				<div class="font-bold text-lg text-gray-800">Herr Müller</div>
				<div class="text-sm text-gray-500">Lehrer</div>
			</div>
			<div class="p-4">
				<button
					onclick="toggleModal('entwurfModal', true)"
					class="w-full bg-blue-600 text-white font-medium py-2 rounded shadow hover:bg-blue-700 transition"
				>
					+ Neuer Antrag
				</button>
			</div>
			<nav class="flex-1 overflow-y-auto">
				<a
					href="3_lehrer_home.html"
					class="block p-4 border-b hover:bg-gray-50 text-gray-600 transition-colors"
					>Posteingang</a
				>
				<a
					href="5_entwuerfe.html"
					class="block p-4 border-b hover:bg-gray-50 text-gray-600 transition-colors"
					>Entwürfe</a
				>
				<a
					href="6_antraege.html"
					class="block p-4 border-b bg-gray-100 border-l-4 border-blue-600 font-semibold text-blue-700 transition-colors"
					>Anträge</a
				>
			</nav>
			<a
				href="1_login.html"
				class="p-4 border-t hover:bg-red-50 text-red-600 text-center font-medium transition"
				>Abmelden</a
			>
		</div>

		<div class="flex-1 p-8 overflow-y-auto flex flex-col">
			<div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
				<div class="flex justify-between items-center mb-6">
					<h1 class="text-2xl font-bold text-gray-800">Meine Anträge</h1>
					<input
						type="text"
						id="searchAntrag"
						onkeyup="filterTable('searchAntrag', 'antragTable')"
						placeholder="Suche..."
						class="w-64 border border-gray-300 rounded px-3 py-2 focus:ring focus:ring-blue-200 outline-none text-sm"
					/>
				</div>

				<div class="overflow-x-auto">
					<table id="antragTable" class="w-full text-left border-collapse">
						<thead>
							<tr class="bg-gray-50 text-gray-600 text-sm border-y">
								<th class="p-3 font-medium">ID</th>
								<th class="p-3 font-medium">Titel</th>
								<th class="p-3 font-medium">Status</th>
								<th class="p-3 font-medium text-right">Aktion</th>
							</tr>
						</thead>
						<tbody class="divide-y text-sm">
							<tr class="hover:bg-gray-50">
								<td class="p-3 font-mono text-gray-500">A1</td>
								<td class="p-3 font-medium">Nachricht 1</td>
								<td class="p-3">
									<span
										class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-800"
										>Offen / Bearbeitung</span
									>
								</td>
								<td class="p-3 text-right">
									<button
										class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 text-sm transition"
									>
										Details
									</button>
								</td>
							</tr>
							<tr class="hover:bg-gray-50">
								<td class="p-3 font-mono text-gray-500">A2</td>
								<td class="p-3 font-medium">Nachricht 2</td>
								<td class="p-3">
									<span
										class="px-2 py-1 rounded text-xs font-semibold bg-red-100 text-red-800"
										>Abgelehnt</span
									>
								</td>
								<td class="p-3 text-right">
									<button
										class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 text-sm transition"
									>
										Details
									</button>
								</td>
							</tr>
							<tr class="hover:bg-gray-50">
								<td class="p-3 font-mono text-gray-500">A3</td>
								<td class="p-3 font-medium">Nachricht 3</td>
								<td class="p-3">
									<span
										class="px-2 py-1 rounded text-xs font-semibold bg-green-100 text-green-800"
										>Genehmigt</span
									>
								</td>
								<td class="p-3 text-right">
									<button
										class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 text-sm transition"
									>
										Details
									</button>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div
			id="entwurfModal"
			class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50"
		>
			<div class="bg-white p-6 rounded-lg shadow-xl w-96">
				<h2 class="text-xl font-bold mb-2">Neuer Entwurf</h2>
				<p class="mb-4 text-gray-600 text-sm">
					Für welche Abteilung ist das Formular?
				</p>
				<div class="space-y-3 mb-6">
					<label class="flex items-center space-x-3 cursor-pointer"
						><input
							type="radio"
							name="abt"
							checked
							class="w-4 h-4 text-blue-600"
						/>
						<span>EMT</span></label
					>
					<label class="flex items-center space-x-3 cursor-pointer"
						><input type="radio" name="abt" class="w-4 h-4 text-blue-600" />
						<span>Wirtschaft</span></label
					>
					<label class="flex items-center space-x-3 cursor-pointer"
						><input type="radio" name="abt" class="w-4 h-4 text-blue-600" />
						<span>Technik</span></label
					>
				</div>
				<div class="flex justify-end space-x-3">
					<button
						onclick="toggleModal('entwurfModal', false)"
						class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-50 transition"
					>
						Abbrechen
					</button>
					<a
						href="5_entwurf_bearbeiten.html"
						class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 shadow transition"
						>Erstellen &rarr;</a
					>
				</div>
			</div>
		</div>
	</body>
</html>
